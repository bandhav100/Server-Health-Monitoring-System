global:
  scrape_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: windows_exporter
    static_configs:
      - targets:
          - host.docker.internal:9182
        labels:
          instance: "100.84.0.9:9182"

  - job_name: hardware_monitor
    static_configs:
      - targets:
          - lhm-exporter:9105
        labels:
          instance: "host.docker.internal:8085"
