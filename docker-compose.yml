services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shms-backend

    ports:
      - "5000:5000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      FLASK_ENV: ${FLASK_ENV}
      FLASK_HOST: ${FLASK_HOST}
      FLASK_PORT: ${FLASK_PORT}
      FLASK_DEBUG: ${FLASK_DEBUG}

      DATABASE_URL: ${DATABASE_URL}

      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      PROMETHEUS_URL: ${PROMETHEUS_URL}

      WINDOWS_EXPORTER_URL: ${WINDOWS_EXPORTER_URL}
      LHM_INSTANCE: ${LHM_INSTANCE}

      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_API_URL: ${GRAFANA_API_URL}
      GRAFANA_API_TOKEN: ${GRAFANA_API_TOKEN}

      ML_SERVICE_URL: ${ML_SERVICE_URL}
      PREDICTION_SERVICE_URL: ${PREDICTION_SERVICE_URL}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      CORS_ORIGINS: ${CORS_ORIGINS}

      LOG_DIR: ${LOG_DIR}

    depends_on:
      - prometheus
      - lhm-exporter

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile

    container_name: shms-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest

    container_name: shms-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - lhm-exporter

    restart: unless-stopped


  lhm-exporter:
    build:
      context: ./lhm-exporter
      dockerfile: Dockerfile

    container_name: shms-lhm-exporter

    ports:
      - "9105:9105"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped


volumes:
  prometheus_data: